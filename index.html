header {

h1 {

/* Honeycomb.

   The hexagons sit on a lattice of half-columns, each one 3/4 of a cell wide.
   Every other half-column is pushed down by half a row, and that offset is
   what makes them interlock. Because the number of half-columns is even,
   "every other half-column" is exactly :nth-child(even) -- one selector, no
   float + shape-outside trick and no per-row rules.

   Everything below is derived from --columns and --gap, so there is a single
   source of truth for the geometry. */
main {
  /* size the honeycomb against its own box rather than 100vw, which would
     include the scrollbar */
  container-type: inline-size;
}

.pages {
  /* Half-columns. MUST stay even, or the :nth-child(even) offset stops
     lining up with the lattice. Half of it is the hexagons per row. */
  --columns: 6;
  --gap: 8px;
  --max-cell: 300px;

  /* A lattice cell is one hexagon plus the gap around it. A band of
     --columns half-columns is (0.75 * --columns + 0.25) cells wide: each
     half-column takes 3/4 of a cell, and the last hexagon overhangs by the
     remaining 1/4. */
  --cell: min(
    calc((100cqi + var(--gap)) / (0.75 * var(--columns) + 0.25)),
    var(--max-cell)
  );
  --hex-width: calc(var(--cell) - var(--gap));
  --hex-height: calc(var(--hex-width) * cos(30deg));
  --half-column: calc(0.75 * var(--cell));
  --row: calc(var(--cell) * cos(30deg));

  display: grid;
  grid-template-columns: repeat(var(--columns), var(--half-column));
  grid-auto-rows: var(--row);
  list-style: none;
  /* hexagons overhang their own track on the right, and the pushed-down ones
     overhang the last row: reserve exactly that much so nothing is clipped */
  padding: 0 calc(var(--hex-width) - var(--half-column))
           calc(var(--hex-height) - var(--row) / 2) 0;
  width: fit-content;
  margin: 0 auto;
}

.pages li {
  width: var(--hex-width);
  height: var(--hex-height);
  clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
}

/* interlock: every other half-column drops by half a row */
.pages li:nth-child(even) {
  margin-block-start: calc(var(--row) / 2);
}

/* fewer, bigger hexagons on narrow screens. Kept below the 600px body-margin
   breakpoint so the two never fight over the same widths. */
@container (width < 560px) {
  .pages {
    --columns: 4;
  }
}

/* End Honeycomb */

.pages li {
  background-color: #FFFFFF;
  transition: opacity 0.3s, scale 0.3s;
}

.pages li:hover {
  opacity: 0.7;
  scale: 1.05;
  z-index: 1;
}

.pages figure {
  margin: 0;
  width: 100%;
  height: 100%;
}

.pages img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Hidden from everyone: the caption is duplicated as the link's aria-label,
   which is what names the link for assistive technology. */
.pages figcaption {
  display: none;
}

a, a:visited {
  color: #000000;
}

@media (prefers-color-scheme: dark) {
  a, a:visited {
    color: #FFFFFF;
  }
}
